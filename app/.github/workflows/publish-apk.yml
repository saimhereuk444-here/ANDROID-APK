name: Publish Debug APK Release

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'apk-distribution/app-debug.apk'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify APK and Checksum
        run: |
          if [ ! -f "apk-distribution/app-debug.apk" ]; then
            echo "Error: apk-distribution/app-debug.apk not found!"
            exit 1
          fi
          if [ ! -s "apk-distribution/app-debug.apk" ]; then
            echo "Error: APK file is empty!"
            exit 1
          fi
          if [ ! -f "apk-distribution/app-debug.apk.sha256" ]; then
            echo "Error: Checksum file not found!"
            exit 1
          fi
          sha256sum -c apk-distribution/app-debug.apk.sha256
          unzip -tq apk-distribution/app-debug.apk

      - name: Create GitHub Release and Upload APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          
          echo "Creating GitHub Release ${TAG_NAME}..."
          gh release create "$TAG_NAME" \
            --title "SH Skin Tool Debug APK Build #${{ github.run_number }}" \
            --notes "Automated genuine Android debug APK build from Google AI Studio environment." \
            --latest=true \
            apk-distribution/app-debug.apk

      - name: Generate Job Summary
        run: |
          APK_SIZE=$(ls -lh apk-distribution/app-debug.apk | awk '{print $5}')
          SHA256_SUM=$(sha256sum apk-distribution/app-debug.apk | awk '{print $1}')
          
          echo "### 🚀 APK Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Release Tag:** debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}" >> $GITHUB_STEP_SUMMARY
          echo "- **APK Size:** $APK_SIZE" >> $GITHUB_STEP_SUMMARY
          echo "- **SHA-256 Checksum:** \`$SHA256_SUM\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Direct Download URL:** https://github.com/${{ github.repository }}/releases/latest/download/app-debug.apk" >> $GITHUB_STEP_SUMMARY
